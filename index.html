<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f2" />
    <meta name="description" content="一款轻巧、清晰的个人待办清单。任务保存在当前浏览器中。" />
    <title>My Todo · 把今天过清楚</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="My Todo 首页">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span>my<span class="brand-light">todo</span></span>
        </a>
        <div class="topbar-note"><span class="status-dot"></span> 只属于你的今天</div>
      </header>

      <main class="main-layout">
        <section class="intro" aria-labelledby="page-title">
          <div class="eyebrow"><span class="eyebrow-line"></span><span id="today-label">今天</span></div>
          <h1 id="page-title">把今天<br /><span>过清楚。</span></h1>
          <p class="intro-copy">把脑海里的事情放下来，<br class="desktop-break" />一件一件，慢慢完成。</p>

          <div class="daily-card">
            <div class="daily-card-top">
              <span>今日进度</span>
              <span class="sun-icon" aria-hidden="true">✳</span>
            </div>
            <div class="progress-number"><span id="completed-count">0</span><span class="progress-divider">/</span><span id="total-count">0</span></div>
            <div class="progress-track" role="progressbar" aria-label="今日完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
            <p class="progress-caption" id="progress-caption">写下第一件想完成的事吧</p>
          </div>

          <div class="side-note"><span class="note-star" aria-hidden="true">✳</span><p>不必一次完成所有事，<br />开始就是很好的进度。</p></div>
        </section>

        <section class="todo-panel" aria-label="待办清单">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">YOUR SPACE</p>
              <h2>待办清单<span class="heading-period">.</span></h2>
            </div>
            <div class="task-total"><span id="remaining-count">0</span><span>件待完成</span></div>
          </div>

          <form class="task-form" id="task-form">
            <label class="sr-only" for="task-input">添加一条待办事项</label>
            <span class="input-plus" aria-hidden="true">＋</span>
            <input id="task-input" name="task" type="text" maxlength="160" placeholder="接下来要做什么？" autocomplete="off" required />
            <button class="add-button" type="submit"><span>添加</span><span aria-hidden="true">↗</span></button>
          </form>
          <p class="form-hint"><kbd>Enter</kbd> 快速添加一条待办</p>

          <div class="list-toolbar">
            <div class="filter-tabs" role="tablist" aria-label="筛选任务">
              <button class="filter-button is-active" type="button" role="tab" aria-selected="true" data-filter="all">全部 <span class="filter-count" id="all-filter-count">0</span></button>
              <button class="filter-button" type="button" role="tab" aria-selected="false" data-filter="active">未完成</button>
              <button class="filter-button" type="button" role="tab" aria-selected="false" data-filter="completed">已完成</button>
            </div>
            <button class="clear-button" id="clear-completed" type="button" hidden>清除已完成</button>
          </div>

          <ul class="task-list" id="task-list" aria-live="polite" aria-relevant="additions removals text"></ul>
          <div class="empty-state" id="empty-state">
            <div class="empty-illustration" aria-hidden="true"><span class="empty-sun">✳</span><span class="empty-check">✓</span><span class="empty-spark">·</span></div>
            <h3 id="empty-title">清单还空着</h3>
            <p id="empty-copy">先添加一件小事，给今天一个开始。</p>
          </div>

          <footer class="panel-footer"><span><span class="footer-lock" aria-hidden="true">◉</span> 自动保存在这台设备</span><span class="footer-heart" aria-hidden="true">✳</span></footer>
        </section>
      </main>
      <footer class="page-footer"><span>慢慢来，也很好。</span><span>MY TODO <span class="footer-year">· 2026</span></span></footer>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
